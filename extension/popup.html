<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Downloads</title><link rel="icon" href="icons/16.png" type="image/png"><link rel="stylesheet" href="popup-brand.css"><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="identity"><img src="icons/32.png" width="30" height="30" alt=""><div><strong id="brand"></strong><small data-copy="title"></small></div></div><label><span data-copy="theme" class="sr-only"></span><select id="theme"></select></label></header>
<div id="status" role="status"></div><div id="preview" hidden><label><span data-copy="states"></span><select id="preview-state"></select></label></div>
<main><label class="capture"><span data-copy="capture"></span><input type="checkbox" id="capture" role="switch"></label>
<label class="capture"><span data-copy="floating"></span><input type="checkbox" id="floating" role="switch"></label>
<label class="capture"><span>Ask before downloading</span><input type="checkbox" id="ask" role="switch"></label>
<section><h2 data-copy="media"></h2><div id="media" class="empty" data-copy="empty"></div></section>
<section><h2 data-copy="pageLinks"></h2><div class="row"><button id="links" data-copy="links"></button><button id="images" data-copy="images"></button></div>
<div id="grab" hidden><label><span class="sr-only" data-copy="filter"></span><input type="text" id="filter"></label><div class="row selection"><button id="all" data-copy="all"></button><button id="none" data-copy="none"></button><span id="count" aria-live="polite"></span></div><div id="list"></div><button id="go" class="primary wide" data-copy="go"></button></div></section>
</main><footer><p id="message" role="status"></p><button id="openUi" class="primary wide" data-copy="open"></button></footer><script type="module" src="popup.js"></script></body></html>
