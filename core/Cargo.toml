[package]
name = "dm-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "dm_core"

[[bin]]
name = "dmcli"
path = "src/bin/dmcli.rs"

[dependencies]
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc"] }
fs4 = "1.1.0"
futures-util = "0.3.34"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["local-offset"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util", "signal", "process"] }

[dev-dependencies]
tiny_http = "0.12.0"
