[package]
name = "dm-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "dm_server"

[[bin]]
name = "dmd"
path = "src/bin/dmd.rs"

[dependencies]
axum = "0.8.9"
dm-core = { version = "0.1.0", path = "../core" }
futures-util = "0.3.34"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tokio-stream = { version = "0.1.19", features = ["sync", "time"] }
toml = "1.1.8"
tray-icon = "0.26.1"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
sha2 = "0.11.1"
tiny_http = "0.12.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[build-dependencies]
winresource = "0.1.34"
