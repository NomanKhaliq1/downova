<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloads</title>
<!-- Functional placeholder UI so the API can be used and tested. Codex replaces this with the real design. -->
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; color: #111; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #181818; } input, textarea, button { background: #262626; color: #eee; border: 1px solid #444; } }
  textarea { width: 100%; height: 64px; box-sizing: border-box; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  td, th { padding: 4px 8px; border-bottom: 1px solid #8884; text-align: left; }
  progress { width: 120px; }
  .bar { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  #clip { display: none; padding: 8px; background: #fd03; margin: 8px 0; }
</style>
</head>
<body>
<h3>Downloads</h3>
<div id="clip"></div>
<textarea id="urls" placeholder="Paste links here, one per line. Patterns like file[001-020].jpg work."></textarea>
<div class="bar">
  <button id="add">Add</button><button id="pauseAll">Pause all</button><button id="resumeAll">Resume all</button>
  <label><input type="checkbox" id="clipOn"> Offer links I copy</label>
  <span id="msg"></span>
</div>
<table><thead><tr><th>Name</th><th>Category</th><th>Status</th><th>Progress</th><th>Speed</th><th>ETA</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<script>
const hash = new URLSearchParams(location.hash.slice(1));
if (hash.get('token')) sessionStorage.setItem('t', hash.get('token'));
const token = sessionStorage.getItem('t') || '';
const $ = (id) => document.getElementById(id);
const api = async (path, method = 'GET', body) => {
  const r = await fetch('/api' + path, { method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  const t = await r.text();
  return { ok: r.ok, data: t ? JSON.parse(t) : null };
};
const mb = (n) => (n / 1048576).toFixed(1) + ' MB';
const tasks = new Map();

function render() {
  const rows = [...tasks.values()].sort((a, b) => b.id - a.id).map((t) => {
    const tr = document.createElement('tr');
    const pct = t.total ? Math.round((t.downloaded * 100) / t.total) : 0;
    const cell = (x) => { const td = document.createElement('td'); td.textContent = x; tr.append(td); return td; };
    cell(t.name || t.url); cell(t.category); cell(t.status);
    const p = document.createElement('td'); const bar = document.createElement('progress'); bar.max = 100; bar.value = pct; p.append(bar, ' ' + pct + '%'); tr.append(p);
    cell(t.speed ? mb(t.speed) + '/s' : ''); cell(t.eta_secs != null ? t.eta_secs + ' s' : '');
    const act = document.createElement('td');
    const btn = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; act.append(b, ' '); };
    if (t.status === 'Downloading' || t.status === 'Queued') btn('Pause', () => api(`/tasks/${t.id}/pause`, 'POST', {}));
    if (t.status === 'Paused' || t.status === 'Failed') btn('Resume', () => api(`/tasks/${t.id}/resume`, 'POST', {}));
    if (t.status === 'Done') { btn('Open', () => api(`/tasks/${t.id}/open`, 'POST', { what: 'file' })); btn('Folder', () => api(`/tasks/${t.id}/open`, 'POST', { what: 'folder' })); }
    btn('Remove', () => api(`/tasks/${t.id}?files=false`, 'DELETE'));
    if (t.error) act.append(t.error);
    tr.append(act);
    return tr;
  });
  $('rows').replaceChildren(...rows);
}

async function reload() { (await api('/tasks')).data.forEach((t) => tasks.set(t.id, t)); render(); }
async function refresh(id) { const r = await api('/tasks/' + id); if (r.ok) tasks.set(id, r.data); render(); }

$('add').onclick = async () => {
  const r = await api('/tasks', 'POST', { urls: $('urls').value });
  $('msg').textContent = r.ok ? `added ${r.data.added.length}, duplicates ${r.data.duplicates.length}, invalid ${r.data.invalid.length}` : r.data.error;
  if (r.ok) $('urls').value = '';
  reload();
};
$('pauseAll').onclick = () => api('/tasks/pause-all', 'POST', {});
$('resumeAll').onclick = () => api('/tasks/resume-all', 'POST', {});
$('clipOn').onchange = async (e) => { const s = (await api('/settings')).data; s.clipboard_monitor = e.target.checked; await api('/settings', 'PUT', s); };

const es = new EventSource('/api/events?token=' + encodeURIComponent(token));
es.addEventListener('task', (e) => { const { kind, id } = JSON.parse(e.data); if (kind === 'removed') { tasks.delete(id); render(); } else refresh(id); });
es.addEventListener('progress', (e) => { JSON.parse(e.data).forEach((p) => { const t = tasks.get(p.id); if (t) Object.assign(t, p); }); render(); });
es.addEventListener('clipboard', (e) => {
  const url = JSON.parse(e.data).url;
  $('clip').style.display = 'block'; $('clip').textContent = 'Download ' + url + '? ';
  const y = document.createElement('button'); y.textContent = 'Yes'; y.onclick = () => { api('/tasks', 'POST', { urls: url }); $('clip').style.display = 'none'; };
  const n = document.createElement('button'); n.textContent = 'No'; n.onclick = () => { $('clip').style.display = 'none'; };
  $('clip').append(y, ' ', n);
});

(async () => { await reload(); $('clipOn').checked = (await api('/settings')).data.clipboard_monitor; if (hash.get('view') === 'add') $('urls').focus(); })();
</script>
</body>
</html>
